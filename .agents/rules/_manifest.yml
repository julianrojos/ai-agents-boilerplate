version: 1

rules:
  - id: general-programming-principles
    file: general-programming-principles.mdc
    applies_to: [source]
    layer: core
  - id: git-constraints
    file: git-constraints.mdc
    applies_to: [all]
    layer: core
  - id: review-judge-workflow-format
    file: review-judge-workflow-format.mdc
    applies_to: [workflow]
    layer: workflow
  - id: skill-input-output-contract
    file: skill-input-output-contract.mdc
    applies_to: [skill]
    layer: skill
  - id: skill-versioning
    file: skill-versioning.mdc
    applies_to: [skill]
    layer: skill

validation:
  checks:
    GIT01:
      rule_ids: [git-constraints]
      blocking: true
    SLOT01:
      rule_ids: [skill-input-output-contract]
      blocking: true
    SKILL01:
      rule_ids: [skill-versioning]
      blocking: true
    WORKFLOW01:
      rule_ids: [review-judge-workflow-format]
      blocking: true

matrix:
  by_doc_type:
    source: [general-programming-principles, git-constraints]
    skill:
      [
        skill-input-output-contract,
        skill-versioning,
        general-programming-principles,
        git-constraints,
      ]
    workflow: [review-judge-workflow-format, git-constraints]
  by_stage:
    implementation: [general-programming-principles, git-constraints]
    review: [review-judge-workflow-format, git-constraints]
    skills:
      [
        skill-input-output-contract,
        skill-versioning,
        general-programming-principles,
        git-constraints,
      ]
